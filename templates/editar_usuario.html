<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
</head>
<body>
    <h1>Editar Usuario</h1>
    <form action="/actualizar/{{ usuario.id }}" method="POST">  
      <label>Nombre:</label>
      <input type="text" name="nombre" value="{{ usuario.nombre }}" /><br />

      <label>apellido:</label>
      <input type="text" name="apellido" value="{{ usuario.apellido }}" /><br />

      <label>email:</label>
      <input type="text" name="gmail" value="{{ usuario.gmail }}" /><br />

      <input type="submit" value="actualizar" />
    </form>
</body>
</html>
